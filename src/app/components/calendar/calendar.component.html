<div class="app-container">
  <app-sidebar 
    [isExpanded]="isSidebarExpanded" 
    [userData]="userData" 
    (toggleSidebar)="toggleSidebar()">
  </app-sidebar>

  <div class="app-content" [class.sidebar-expanded]="isSidebarExpanded">
    <div class="calendar-container">
      <div class="calendar-main">
        <div class="calendar-view">
          <full-calendar 
            #calendar
            [options]="calendarOptions"
            class="calendar-view">
            <ng-template #eventContent let-arg>
              <div class="event-template">
                <i [class]="'pi ' + (arg.event.extendedProps?.type === 'vacation' ? 'pi-calendar-plus' : 'pi-heart')"></i>
                <span class="event-time">{{ arg.timeText }}</span>
                <span class="event-title">{{ arg.event.title }}</span>
              </div>
            </ng-template>
          </full-calendar>
        </div>
      </div>
    </div>
  </div>
</div>

<p-dialog 
  [(visible)]="showEventDialog" 
  [style]="{width: '450px'}" 
  [header]="dialogMode === 'create' ? 'Add Event' : 'Edit Event'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false">
  
  <form [formGroup]="eventForm" (ngSubmit)="onSubmitEvent()">
    <div class="p-field">
      <label for="title">Title</label>
      <input id="title" type="text" pInputText formControlName="title" class="w-full">
    </div>
    
    <div class="p-field">
      <label for="start">Start Date</label>
      <p-calendar id="start" formControlName="start" [showTime]="true" [showSeconds]="false" appendTo="body"></p-calendar>
    </div>
    
    <div class="p-field">
      <label for="end">End Date</label>
      <p-calendar id="end" formControlName="end" [showTime]="true" [showSeconds]="false" appendTo="body"></p-calendar>
    </div>
    
    <div class="p-field">
      <label for="description">Description</label>
      <textarea id="description" pInputTextarea formControlName="description" [rows]="3" class="w-full"></textarea>
    </div>
    
    <div class="p-field-checkbox">
      <p-checkbox formControlName="allDay" [binary]="true" inputId="allDay"></p-checkbox>
      <label for="allDay">All Day Event</label>
    </div>
  </form>
  
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showEventDialog = false"></button>
    <button pButton type="button" [label]="dialogMode === 'create' ? 'Add' : 'Update'" (click)="onSubmitEvent()"></button>
    <button *ngIf="dialogMode === 'edit'" pButton type="button" label="Delete" class="p-button-danger" (click)="onDeleteEvent()"></button>
  </ng-template>
</p-dialog>

<p-toast></p-toast>
